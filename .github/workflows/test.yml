name: tests

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std if it is not vendored
        run: |
          if [ ! -d lib/forge-std/src ]; then
            forge install foundry-rs/forge-std --no-commit
          fi
      - name: Format
        run: forge fmt --check
      - name: Test
        run: forge test -vv
